name: Canary Workflow

on:
  push:
    branches:
        - canary
        - '!release/**'

jobs:
  canary:
      name: Build Canary Docker
      runs-on: ubuntu-24.04
      permissions:
          packages: write
          contents: read
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/canary' }}
      steps:
          - name: Check Out Repo
            uses: actions/checkout@v4
            with:
                ref: canary

          - name: NodeJS to Compile WebUI
            uses: actions/setup-node@v4
            with:
                node-version: 24
          - run: |
                cd UI/Web || exit
                echo 'Installing web dependencies'
                npm install --legacy-peer-deps

                echo 'Building UI'
                npm run prod

                echo 'Copying back to Kavita wwwroot'
                rsync -a dist/ ../../Kavita.Server/wwwroot/

                cd ../ || exit

          - name: Get csproj Version
            uses: kzrnm/get-net-sdk-project-versions-action@v2
            id: get-version
            with:
                proj-path: Kavita.Common/Kavita.Common.csproj

          - name: Echo csproj version
            run: echo "${{steps.get-version.outputs.assembly-version}}"

          - name: Compile dotnet app
            uses: actions/setup-dotnet@v4
            with:
                dotnet-version: 10.0.x

          - name: Install Swashbuckle CLI
            run: dotnet tool install -g Swashbuckle.AspNetCore.Cli

          - run: ./monorepo-build.sh

          - name: Login to GitHub Container Registry
            uses: docker/login-action@v3
            with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

          - name: Set up QEMU
            uses: docker/setup-qemu-action@v3

          - name: Set up Docker Buildx
            id: buildx
            uses: docker/setup-buildx-action@v3

          - name: Extract metadata (tags, labels) for Docker
            id: docker_meta_canary
            uses: docker/metadata-action@v5
            with:
                tags: |
                    type=raw,value=canary
                    type=raw,value=canary-${{ steps.get-version.outputs.assembly-version }}
                images: |
                    name=ghcr.io/${{ github.repository }}

          - name: Build and push
            id: docker_build
            uses: docker/build-push-action@v5
            with:
                context: .
                platforms: linux/amd64,linux/arm/v7,linux/arm64
                push: true
                tags: ${{ steps.docker_meta_canary.outputs.tags }}
                labels: ${{ steps.docker_meta_canary.outputs.labels }}

          - name: Image digest
            run: echo ${{ steps.docker_build.outputs.digest }}
