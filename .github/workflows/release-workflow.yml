name: Release Workflow

on:
  push:
    branches: ["develop"]

permissions:
  contents: write
  packages: write

jobs:
  run-release-tool:
    if: github.repository == 'LeviBickel/Kavita'
    uses: Kareadita/GitHubActions/.github/workflows/release-tools.base.yml@main
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      config-path: release.yml
      dockerhub-username: "levibickel"
      uses-docker: true
