<ng-container *transloco="let t; prefix: 'create-smart-collection-modal'">
  <div class="modal-container">
    <div class="modal-header">
      <h5 class="modal-title" id="modal-basic-title">{{ t('title') }}</h5>
      <button
        type="button"
        class="btn-close"
        [attr.aria-label]="t('close')"
        (click)="close()">
      </button>
    </div>

    <div class="modal-body scrollable-modal py-4">
      <p>{{ t('description') }}</p>

      @if (isLoading()) {
        <app-loading [loading]="isLoading()" />
      } @else if (seriesFilters().length === 0) {
        <app-empty-state titleKey="no-data" descriptionKey="no-data-description" i18nPrefix="create-smart-collection-modal">
          <i icon class="fa-solid fa-bars-staggered" aria-hidden="true"></i>
        </app-empty-state>
      } @else {
        <div class="mb-3">
          <label for="smart-collection-title" class="form-label">{{ t('collection-title-label') }}</label>
          <input id="smart-collection-title" type="text" class="form-control" [formField]="formGroup.title">
        </div>

        <div class="mb-3">
          <label for="smart-collection-filter" class="form-label">{{ t('smart-filter-label') }}</label>
          <select id="smart-collection-filter" class="form-select" (change)="selectFilter($event)">
            <option value="" selected disabled>{{ t('smart-filter-placeholder') }}</option>
            @for (filter of seriesFilters(); track filter.id) {
              <option [value]="filter.id">{{ filter.name }}</option>
            }
          </select>
        </div>
      }
    </div>

    <div class="modal-footer">
      <button
        type="button"
        class="btn btn-secondary"
        (click)="close()">
        {{ t('cancel') }}
      </button>

      <button
        type="button"
        class="btn btn-primary"
        (click)="submit()"
        [disabled]="isSaving() || formGroup().invalid() || seriesFilters().length === 0">

        @if (isSaving()) {
          <span
            class="spinner-border spinner-border-sm me-2"
            role="status"
            aria-hidden="true">
          </span>
        }

        {{ isSaving() ? t('saving') : t('submit') }}
      </button>
    </div>
  </div>
</ng-container>
